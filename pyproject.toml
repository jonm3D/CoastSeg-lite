[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coastseg-lite"
version = "0.2.0"
description = "Minimal pinned CoastSeg RGB SegFormer inference runtime"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {file = "LICENSE"}
dependencies = [
  "astropy>=6.1,<8",
  "numpy==1.26.4",
  "pillow==12.1.1",
  "scikit-image>=0.24,<0.26",
  "scipy>=1.14,<1.17",
  "tensorflow==2.15.1",
  "transformers==4.48.3",
]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[project.scripts]
coastseg-lite = "coastseg_lite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coastseg_lite = ["model_manifest.json", "segformer_b0_config.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "real_model: requires the pinned downloaded model",
]
